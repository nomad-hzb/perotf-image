# Deployment of the KIT NOMAD Oasis (http://elnserver.lti.kit.edu).
#
# Secrets are not part of this repository. They live next to this file on the server:
#   .env        NOMAD_SERVICES_API_SECRET, NOMAD_NORTH_JUPYTERHUB_CRYPT_KEY,
#               NOMAD_NORTH_HUB_SERVICE_API_TOKEN
#   .env.north  KEYCLOAK_URL, KEYCLOAK_REALM, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET,
#               SERVICE_API_TOKEN (same value as NOMAD_NORTH_HUB_SERVICE_API_TOKEN),
#               JUPYTERHUB_CRYPT_KEY
#
# Set IMAGE_TAG (e.g. IMAGE_TAG=pr-15) to run images built for a pull request.
#
# Unchanged on purpose, these are separate migration steps:
#   - Elasticsearch 7 (ES9 migration: https://docs.nomad-lab.eu/howto/oasis/migrate/v2.0.html)
#   - MongoDB 5 (MongoDB major upgrades must go 5 -> 6 -> 7 -> 8)
#   - Temporal auto-setup 1.28

services:
  # the search engine
  elastic:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: nomad_oasis_elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://elastic:9200/_cat/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # the user data db
  mongo:
    restart: unless-stopped
    image: mongo:5.0.6
    container_name: nomad_oasis_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null # --quiet
    healthcheck:
      test:
        - "CMD"
        - "mongo"
        - "mongo:27017/test"
        - "--quiet"
        - "--eval"
        - "'db.runCommand({ping:1}).ok'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # the temporal persistence db
  postgresql:
    restart: unless-stopped
    container_name: nomad_oasis_postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:16
    volumes:
      - postgresql:/var/lib/postgresql/data

  # the workflow orchestration server
  temporal:
    restart: unless-stopped
    container_name: nomad_oasis_temporal
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: docker.io/temporalio/auto-setup:1.28
    healthcheck:
      test: >
        bash -c '
          temporal operator cluster health --address $$(hostname -i):7233 |
          grep -q "SERVING"
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # nomad worker (processing)
  worker:
    restart: unless-stopped
    image: ghcr.io/nomad-hzb/perotf-image_test:${IMAGE_TAG:-main}
    platform: linux/amd64
    environment:
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run action-internal-worker
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8080/health"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: "12.0"
          memory: 16G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 15
        window: 1800s

  # nomad app (api + gui)
  app:
    restart: unless-stopped
    image: ghcr.io/nomad-hzb/perotf-image_test:${IMAGE_TAG:-main}
    platform: linux/amd64
    container_name: nomad_oasis_app
    environment:
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 80
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 2
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8000/-/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad remote tools hub (JupyterHub)
  # Before changing the image tag: see the TODO in configs/north_jupyterhub_config.py
  north:
    restart: unless-stopped
    image: ghcr.io/fairmat-nfdi/nomad-north:v2.0.0rc1
    platform: linux/amd64
    container_name: nomad_oasis_north
    # KIT workaround: passes NOMAD_CLIENT_* to tool containers (nomad-north issue #10)
    command: ["jupyterhub", "-f", "/srv/jupyterhub/jupyterhub_config_kit.py"]
    environment:
      NOMAD_API_URL: "http://app:8000/backend/api/v1"
      BASE_URL: "/backend/north/"
      # must match the address users open in the browser
      OAUTH_CALLBACK_URL: "http://elnserver.lti.kit.edu/backend/north/hub/oauth_callback"
      DOCKER_PREFIX: "nomad-oasis-north"
      DOCKER_NETWORK: "nomad_oasis_network"
    env_file:
      - ./.env.north
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # JupyterHub database and cookie secret
      - "nomad_north:/data"
      - ./configs/north_jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config_kit.py:ro
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8081/backend/north/hub/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # one-off job so that `docker compose pull` also pulls the jupyter image used by NORTH
  jupyterlab_image:
    image: ghcr.io/nomad-hzb/perotf-image_test/jupyter:${IMAGE_TAG:-main}
    platform: linux/amd64
    container_name: nomad_jupyter_image
    pull_policy: always
    entrypoint: ["true"]
    deploy:
      replicas: 0

  # nomad proxy (a reverse proxy for nomad)
  proxy:
    restart: unless-stopped
    image: docker.io/nginx:1.31.1-alpine
    container_name: nomad_oasis_proxy
    command: nginx -g 'daemon off;'
    volumes:
      - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
      - ./configs/nginx_maps_conf:/etc/nginx/conf.d/nginx_maps_conf:ro
      - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started
      north:
        condition: service_healthy
    ports:
      - 80:80

volumes:
  mongo:
    name: "nomad_oasis_mongo"
  elastic:
    name: "nomad_oasis_elastic"
  postgresql:
    name: "nomad_oasis_postgresql"
  nomad_north:
    name: "nomad_oasis_north"

networks:
  default:
    name: nomad_oasis_network
